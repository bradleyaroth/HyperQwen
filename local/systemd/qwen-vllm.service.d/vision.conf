# Vision on via upstream VISION=1 (patches/vision-tower-cpu-offload.patch, bulk-copy;
# VISION_OFFLOAD defaults 1 -> VLLM_VISION_CPU_OFFLOAD_GB=1 covers the 0.86 GiB tower).
# Caps: dotted args are appended last by vLLM's parser and REPLACE VISION=1's 2 MP /
# 1-image defaults. size.shortest_edge == min_pixels, size.longest_edge == max_pixels.
# 4 images/request, video off, min 1003520 px (small-image OCR), max 4194304 px (4 MP).
# Tool flags come from the launcher (TOOLS=1 default). Rollback: delete this file.
[Service]
Environment=VISION=1
# Chat template 2026-10-15: froggeric v22.5 (templates/qwen3.8-froggeric-v22.5.jinja)
# from hf/froggeric/Qwen-Fixed-Chat-Templates — default reasoning effort = medium (zero-token),
# XML tool format (coherent with the launcher TOOLS=1 qwen3_coder parser). Rollback: remove
# the --chat-template token from EXTRA_ARGS and restart.
Environment="EXTRA_ARGS=--limit-mm-per-prompt.image 4 --limit-mm-per-prompt.video 0 --mm-processor-kwargs.size.shortest_edge 1003520 --mm-processor-kwargs.size.longest_edge 4194304 --allowed-media-domains 192.168.13.240 192.168.13.246 dvbx1 dvbx1.reliantrack.local 192.168.13.242 llm.reliantrack.local localhost 127.0.0.1 --chat-template /mnt/llm_storage/qwen-serving/templates/qwen3.8-froggeric-v22.5.jinja"
