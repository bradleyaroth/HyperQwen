# Vision on, ViT weights in host RAM (patches/qwen3_5-vision-uva.patch).
# start_qwen.sh hard-codes --language-model-only; --no-language-model-only below
# overrides it (argparse BooleanOptionalAction, last flag wins).
# Images capped at 6 MP (<=6144 tokens/image; probe-tested: KV 287,833 tokens,
# no OOM incl. 4x 6MP in one message). Video disabled. Image limit 4/request.
# --allowed-media-domains: exact-hostname allowlist for server-side URL fetch
# (nargs list, matched verbatim against the URL hostname; data: URIs bypass it).
# Rollback: delete this file, daemon-reload, restart.
[Service]
Environment=QWEN3_5_VISION_UVA=1
Environment="EXTRA_ARGS=--enable-auto-tool-choice --tool-call-parser qwen3_coder --no-language-model-only --limit-mm-per-prompt.image 4 --limit-mm-per-prompt.video 0 --mm-processor-kwargs.min_pixels 65536 --mm-processor-kwargs.max_pixels 6291456 --allowed-media-domains 192.168.13.240 192.168.13.246 dvbx1 dvbx1.reliantrack.local 192.168.13.242 llm.reliantrack.local localhost 127.0.0.1"
